<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small task tracker for keeping track of what you want to get done."
    />
    <title>Tiny Task Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">A little progress, every day</p>
        <h1>Tiny Task Tracker</h1>
        <p class="subtitle">Make a list. Take it one step at a time.</p>
      </header>

      <section class="task-card" aria-labelledby="list-heading">
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">Your next task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="120"
            placeholder="What would you like to do?"
            autocomplete="off"
            required
          />
          <button type="submit">Add task</button>
        </form>

        <div class="list-heading">
          <h2 id="list-heading">Your list</h2>
          <p id="task-count" aria-live="polite"></p>
        </div>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="empty-state">Nothing here yet. Add your first task above.</p>
      </section>

      <footer class="page-footer">Your tasks stay on this device.</footer>
    </main>
  </body>
</html>
